apiVersion: v1
kind: Service
metadata:
  name: dockerhub-image-policy-webhook
  namespace: image-policy-system
spec:
  ports:
  - port: 443
    targetPort: 5000
  selector:
    app: dockerhub-image-policy-webhook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockerhub-image-policy-webhook
  namespace: image-policy-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dockerhub-image-policy-webhook
  template:
    metadata:
      labels:
        app: dockerhub-image-policy-webhook
    spec:
      containers:
      - name: webhook
        image: techiescamp/kubeimageguard:latest
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: webhook-certs
          mountPath: /etc/webhook/certs
          readOnly: true
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 5
          timeoutSeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 5
          timeoutSeconds: 5
      volumes:
      - name: webhook-certs
        secret:
          secretName: dockerhub-image-policy-webhook-certs
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: dockerhub-image-policy-webhook-config
  namespace: image-policy-system
webhooks:
- name: imagepolicy.k8s.io
  admissionReviewVersions: ["v1", "v1beta1"]
  clientConfig:
    service:
      name: dockerhub-image-policy-webhook
      namespace: image-policy-system
      path: "/webhook"
      port: 443
    caBundle: ${CA_BUNDLE}
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["apps"]
    apiVersions: ["v1"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["batch"]
    apiVersions: ["v1"]
    resources: ["jobs", "cronjobs"]
  failurePolicy: Fail
  sideEffects: None
  timeoutSeconds: 5